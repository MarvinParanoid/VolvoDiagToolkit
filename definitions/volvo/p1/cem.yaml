# Volvo V50 (P1) CEM / Passenger Junction Box A - the D2 central module on
# bus 1 (500k), comm address 0x50. Read with the same Volvo A6 protocol as the
# ECM, on the same channel.
#
# Parameters extracted from VIDA CarCom, EcuVariant 1175 (30728171 AA), which
# the car's profile (V50 2007 D4164T MTX75) names as this car's CEM. Battery
# voltage 0x1A02 was confirmed on the wire (raw 0x01EE -> 12.35 V).

vehicle:
  make: Volvo
  model: V50
  platform: P1
  engine: D4164T

ecus:
  CEM:
    tx: 0x726
    rx: 0x72E
    network: powertrain-can
    protocol: volvo
    volvo_group: 0x50
    description: Central electronic module / Passenger Junction Box A (D2), bus 1

parameters:

  cem_battery_voltage:
    name: 30-supply
    ecu: CEM
    protocol: volvo
    group: 0x50
    identifier: 0x1A02
    encoding: {type: uint16_be, mask: 0x3FF, scale: 0.025}
    unit: "V"
    status: verified-against-vida
    source: "VIDA CarCom EcuVariant 1175 (V50 2007 D4164T CEM); REID 0x1A02; captured on wire 2026-08-01"
    sample: "CE50E61A0201EE00"

