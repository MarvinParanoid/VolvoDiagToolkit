# Volvo V50 (P1) — CEM configuration blocks, from CarCom EcuVariant 1175 (2026-08-01).
#
# Read-only decode maps for the car's programmed configuration. All three
# blocks use services this toolkit already speaks:
#   FB    vehicle identity   (B9 identity read; VIN verified against a capture)
#   FC    car configuration  (B9 read; one option per byte, fixed offsets)
#   C010  installed modules  (A6 read; bitmap of fitted control units)
#
# FC decode VERIFIED against a captured VIDA session (21-car-config): the block
# reassembles and 96/99 options decode to coherent values for this car — V50,
# 5 doors, MTX75 manual, diesel D4164T, ECC, DSTC, DPF with ADM, German. The
# byte 0/1 header carries an 8-bit additive checksum (sum of the option bytes).
# See tests/../test_config.py::test_car_config_decodes_captured_block.

ecu: CEM
ecu_variant: 1175

identity:
  request: "FB"
  # byte0 data length, bytes1-5 config document number (BCD), then ASCII config
  # issue number; remaining fields are CRLF-separated ASCII in this order.
  fields:
    - {offset_bits: 0, len_bits: 8, type: Unsigned, name: "Data length"}
    - {offset_bits: 8, len_bits: 40, type: BCD, name: "Car configuration document number"}
    - {offset_bits: 48, len_bits: 24, type: Ascii, name: "Car configuration issue number"}
    - {offset_bits: 88, len_bits: 136, type: Ascii, name: "VIN"}
    - {offset_bits: 240, len_bits: 72, type: Ascii, name: "FYON"}
    - {offset_bits: 328, len_bits: 24, type: Ascii, name: "Type (PNR-3)"}
    - {offset_bits: 368, len_bits: 48, type: Ascii, name: "Chassis"}
    - {offset_bits: 432, len_bits: 16, type: Unsigned, name: "Factory code"}
    - {offset_bits: 464, len_bits: 48, type: Ascii, name: "Structure week"}
    - {offset_bits: 528, len_bits: 160, type: Ascii, name: "Package identity"}
    - {offset_bits: 704, len_bits: 2032, type: Ascii, name: "Market code"}

