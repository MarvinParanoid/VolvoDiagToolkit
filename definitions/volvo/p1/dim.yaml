# Volvo V50 (P1) DIM module. Volvo A6 protocol, comm address 0x51,
# bus 3 (125k) - read with --baudrate 125000.
# Extracted from VIDA CarCom (this car's profile variant); formulas and units
# are VIDA's own.

ecus:
  DIM:
    tx: 0x726
    rx: 0x72E
    protocol: volvo
    volvo_group: 0x51
    bus: 3
    baudrate: 125000
    description: DIM (D2), comm 0x51

parameters:

  total_fuel_level:
    name: Total fuel level
    ecu: DIM
    protocol: volvo
    group: 0x51
    identifier: 0x0001
    encoding: {type: uint8, scale: 0.5}
    unit: "L"
    status: verified
    source: "VIDA CarCom, this car profile variant; REID 0x0001"

  engine_coolant_temperature:
    name: Engine coolant temperature
    ecu: DIM
    protocol: volvo
    group: 0x51
    identifier: 0x0002
    encoding: {type: uint8, offset: -60}
    unit: "degC"
    status: verified
    source: "VIDA CarCom, this car profile variant; REID 0x0002"

  engine_speed:
