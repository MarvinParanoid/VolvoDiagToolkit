# Volvo V50 (P1), D4164T — 1.6D, PSA DV6TED4, Euro 4, DPF.
#
# RULES FOR THIS FILE
#
#   * Nothing goes in until a log shows the car answering it. A DID copied
#     from a forum is a guess, and a guess with a unit next to it is worse
#     than no entry at all.
#   * Every parameter carries `status`, `source` and a raw `sample`.
#   * Volvo reuses identifiers across ECM software levels with different
#     scaling. Record `ecu_software` when you verify one.
#
# Statuses, weakest to strongest:
#   candidate              seen in a VIDA log, meaning inferred, never checked
#   discovered             the car answers it, encoding still a guess
#   experimental           encoding plausible and stable over a drive
#   verified               cross-checked against a second source or physics
#   verified-against-vida  VIDA and this toolkit show the same number
#
# Workflow for filling in the empty section at the bottom: docs/method.md.

vehicle:
  make: Volvo
  model: V50
  platform: P1
  engine: D4164T
  years: "2006-2010"
  ecu_software: ""        # fill in from `volvo-monitor info` (DID F194)

ecus:
  # MEASURED, not assumed. A VIDA session through the proxy (2026-08-01) showed
  # this ECM does NOT answer the legislated OBD addressing at all: physical
  # 0x7E0, functional 0x7DF and Volvo's 11-bit 0x726 were all silent. VIDA
  # reads the engine over Volvo's proprietary protocol on raw 29-bit CAN
  # instead (see docs/volvo-protocol.md). The 0x7E0 pair below is kept only as
  # the nominal OBD address; nothing here uses it for this engine.
  ECM:
    tx: 0x7E0
    rx: 0x7E8
    network: powertrain-can
    protocol: volvo               # engine data comes via the A6 read service
    volvo_group: 0x11             # bank used for live engine data
    description: Bosch EDC16C31, read via the Volvo proprietary protocol

parameters:

  # ---------------------------------------------------------------------
  # Volvo proprietary "A6" live data, bank 0x11. Discovered by capturing a
  # VIDA ECM live-data session through the proxy (logs/*-10-ecm-livedata,
  # 2026-08-01) and matching each identifier's value range against VIDA's
  # displayed readings.
  #
  # STATUS HONESTY: the scale on the pressure parameters is anchored to
  # physics (all three sat near atmospheric with the engine off, ~1013 hPa =
  # 101.3 kPa), so they are `experimental`. The rest are `discovered` — the
  # ECM answers and the identifier is certain, but the exact scale is not yet
  # confirmed against a synced VIDA reading, so they carry no unit.
  # Actual-vs-requested for boost is still a hypothesis (see notes).
  # ---------------------------------------------------------------------

  boost_actual:
    name: Intake manifold pressure (boost, actual)
    ecu: ECM
    protocol: volvo
    group: 0x11
    identifier: 0x003A
    encoding: {type: uint16_be, scale: 0.1}   # hPa -> kPa
    unit: kPa
    min: 0
    max: 350
    status: experimental
    source: "10-ecm-livedata.jsonl, 2026-08-01; id 3A ranged 985-1028 (~atmospheric), VIDA 'давление впускного коллектора' ~1019 hPa"
    sample: "CE11E6003A040100"
    notes: VIDA labels this the intake manifold pressure, which is the actual
      boost. Scale 0.1 (hPa to kPa) makes idle read ~102 kPa, matching baro.

  boost_requested:
    name: Boost pressure, requested
    ecu: ECM
    protocol: volvo
    group: 0x11
    identifier: 0x007E
    encoding: {type: uint16_be, scale: 0.1}
    unit: kPa
    min: 0
    max: 350
    status: experimental
    source: "10-ecm-livedata.jsonl, 2026-08-01; id 7E ranged 1010-1215, VIDA 'давление наддува, ожидаемое' ~1053 hPa"
    sample: "CE11E6007E03F200"
    notes: Assigned to 'requested' because it climbed above id 3A under demand;
      actual-vs-requested must still be confirmed against a synced VIDA view.

  dpf_differential_pressure:
    name: DPF differential pressure
    ecu: ECM
    protocol: volvo
    group: 0x11
    identifier: 0x00AE
    encoding: {type: uint16_be, scale: 0.1}
    unit: kPa
    min: 0
    max: 100
    status: experimental
    source: "10-ecm-livedata.jsonl, 2026-08-01; id AE ranged 0-28 at idle, VIDA 'пылевой фильтр датчика давления' ~27 hPa"
    sample: "CE11E600AE000000"
    notes: A primary target parameter. Small at idle as expected; scale 0.1
      (hPa->kPa) gives a few kPa, physically right for a clear filter.

  maf:
    name: Mass air flow
    ecu: ECM
    protocol: volvo
    group: 0x11
    identifier: 0x002E
    encoding: {type: uint16_be}
    status: discovered
    source: "10-ecm-livedata.jsonl, 2026-08-01; id 2E ranged 0-2710, VIDA 'датчик массового расхода воздуха' ~29 kg/h (scale ~0.01 unconfirmed)"
    sample: "CE11E6002E000000"

  air_mass_per_stroke:
    name: Air mass per stroke
    ecu: ECM
    protocol: volvo
    group: 0x11
    identifier: 0x009E
    encoding: {type: uint16_be}
    status: discovered
    source: "10-ecm-livedata.jsonl, 2026-08-01; id 9E ranged 2347-5186, VIDA 'воздушная масса/ход' ~301 mg (scale ~0.1 unconfirmed)"
    sample: "CE11E6009E092B00"

  fuel_rail_pressure:
    name: Fuel rail pressure
    ecu: ECM
    protocol: volvo
    group: 0x11
    identifier: 0x0050
    encoding: {type: uint16_be}
    status: discovered
    source: "10-ecm-livedata.jsonl, 2026-08-01; id 50 ranged 0-32767, VIDA 'датчик давления топлива' (scale unknown)"
    sample: "CE11E60050000000"

  # ---------------------------------------------------------------------
  # Standard SAE J1979 PIDs and UDS identifiers.
  #
  # WARNING: on THIS car none of these answered. A proxy capture (2026-08-01)
  # showed the ECM silent to physical 0x7E0, functional 0x7DF and 11-bit
  # 0x726 — it only speaks the Volvo A6 protocol above. Their encodings are
  # standard and correct, so the status is left as-is, but do not expect them
  # to return anything on the D4164T; they are kept for reference and for
  # other P1 variants whose ECM does legislated OBD.
  # ---------------------------------------------------------------------

  rpm:
    name: Engine speed
    ecu: ECM
    request: "010C"
    encoding: {type: uint16_be, scale: 0.25}
    unit: rpm
    min: 0
    max: 8000
    status: experimental
    source: SAE J1979 PID 0x0C
    notes: Support is mandatory for OBD; treat a negative response as a wiring
      or addressing problem rather than a missing parameter.

  intake_manifold_pressure:
    name: Intake manifold pressure (absolute)
    ecu: ECM
    request: "010B"
    encoding: {type: uint8}
    unit: kPa
    min: 0
    max: 255
    status: experimental
    source: SAE J1979 PID 0x0B
    notes: 1 kPa resolution. Usable as a sanity check against a Volvo-specific
      boost parameter, too coarse to replace one.

  barometric_pressure:
    name: Barometric pressure
    ecu: ECM
    request: "0133"
    encoding: {type: uint8}
    unit: kPa
    min: 50
    max: 120
    status: experimental
    source: SAE J1979 PID 0x33
    notes: Needed to turn absolute manifold pressure into relative boost.

  coolant_temperature:
    name: Coolant temperature
    ecu: ECM
    request: "0105"
    encoding: {type: uint8, offset: -40}
    unit: degC
    min: -40
    max: 215
    status: experimental
    source: SAE J1979 PID 0x05

  intake_air_temperature:
    name: Intake air temperature
    ecu: ECM
    request: "010F"
    encoding: {type: uint8, offset: -40}
    unit: degC
    min: -40
    max: 215
    status: experimental
    source: SAE J1979 PID 0x0F

  # (The standard J1979 MAF PID 0x10 is not listed here: it clashed with the
  # Volvo A6 'maf' above, and this ECM does not answer legislated OBD anyway.)

  # ---------------------------------------------------------------------
  # Identification. Read these first: every other definition in this file is
  # only valid for the software level they report.
  # ---------------------------------------------------------------------

  vin:
    name: VIN
    ecu: ECM
    request: "22F190"
    encoding: {type: ascii}
    status: experimental
    source: ISO 14229 standard identifier
    notes: If this is rejected, the ECM may answer OBD mode 09 02 instead.

  ecm_software_number:
    name: ECM software number
    ecu: ECM
    request: "22F194"
    encoding: {type: ascii}
    status: experimental
    source: ISO 14229 standard identifier

# ---------------------------------------------------------------------
# NOT YET FOUND — the whole point of the project.
#
# The dashboard looks for these keys; until they exist here it falls back to
# whatever standard PID comes closest and labels the reading as such:
#
#   boost_actual
#   boost_requested
#   dpf_differential_pressure
#   dpf_soot_load
#   exhaust_temperature
#   regeneration_active
#   distance_since_regeneration
#
# Template once a log has shown you the request and the answer:
#
#   boost_actual:
#     name: Boost pressure, actual
#     ecu: ECM
#     request: "22XXXX"
#     response_prefix: "62XXXX"     # optional, derived from the request
#     encoding: {type: uint16_be, scale: 0.1, byte_offset: 0}
#     unit: kPa
#     min: 50
#     max: 300
#     status: discovered
#     source: "03-plus-boost.jsonl, VIDA ECM live data, 2026-xx-xx"
#     sample: "62XXXX03F6"
#     notes: VIDA showed 101.4 kPa at idle while the raw value read 0x03F6.
# ---------------------------------------------------------------------
